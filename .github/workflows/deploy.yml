name: Build Next.js and Deploy to Bonto

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npx next build
        env:
          NODE_ENV: production

      - name: Create standalone output
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          cp -r public deploy/public
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp package.json deploy/
          
          cat > deploy/start.sh << 'EOF'
          #!/bin/bash
          export NODE_ENV=production
          export PORT=3000
          node server.js
          EOF
          
          chmod +x deploy/start.sh
          
          cat > deploy/bonto.json << 'EOF'
          {
            "start": "bash start.sh",
            "port": 3000
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonto-deploy
          path: deploy/
          retention-days: 7

      # ====== دیپلوی خودکار به Bonto با Git ======
      - name: Deploy to Bonto via Git
        run: |
          # تنظیم Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # ساخت آدرس با username و password از secrets
          REPO_URL="https://${{ secrets.BONTO_USERNAME }}:${{ secrets.BONTO_PASSWORD }}@api.bonto.dev/git/parsa.git"
          
          # کلون کردن ریپوی Bonto
          git clone $REPO_URL bonto-repo || echo "Repo exists"
          
          # پاک کردن فایل‌های قبلی
          rm -rf bonto-repo/*
          
          # کپی فایل‌های جدید
          cp -r deploy/* bonto-repo/
          
          # Commit و Push
          cd bonto-repo
          git add .
          git commit -m "Deploy from GitHub Actions - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push $REPO_URL main