name: Deploy to Bonto

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --legacy-peer-deps
      - run: npx next build

      - name: Prepare standalone
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          cp -r public deploy/public
          cp .next/static deploy/.next/static || true
          cat > deploy/start.sh << 'EOF'
          #!/bin/bash
          export PORT=3000
          node server.js
          EOF
          chmod +x deploy/start.sh

      - name: Push to Bonto
        run: |
          git config --global user.name "Actions"
          git config --global user.email "actions@github.com"
          REPO_URL="https://${{ secrets.BONTO_USERNAME }}:${{ secrets.BONTO_PASSWORD }}@api.bonto.dev/git/parsa.git"
          git clone $REPO_URL bonto-repo
          rm -rf bonto-repo/*
          cp -r deploy/* bonto-repo/
          cd bonto-repo
          git add .
          git commit -m "deploy" || echo "no changes"
          git push $REPO_URL main